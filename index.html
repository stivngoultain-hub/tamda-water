<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جمعية تامدة للتنمية</title>
    <!-- استدعاء خط تجوال المطابق لملف CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الواجهة التي ستظهر على الشاشة وتختفي عند الطباعة بفضل كلاس no-print -->
    <div class="no-print" style="padding: 20px; max-width: 600px; margin: 20px auto;">
        <div class="card">
            <h2 class="card-title">نظام إدارة الأداءات</h2>
            <p style="margin-bottom: 20px;">يرجى مراجعة بيانات الوصل قبل إعطاء أمر الطباعة.</p>
            
            <!-- الأزرار متوافقة مع المتغيرات --primary-cyan و --danger-red -->
            <button class="btn btn-primary" onclick="window.print()">🖨️ طباعة الوصل</button>
            <button class="btn btn-danger">إلغاء العملية</button>
        </div>
    </div>

    <!-- هيكل الوصل المخصص للطباعة الحرارية (58mm) -->
    <div class="card" id="receiptCard" style="max-width: 300px; margin: 0 auto;">
        <div class="receipt-header">
            <h3>جمعية تامدة للتنمية</h3>
            <p>وصل استلام / أداء</p>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>البيان</th>
                    <th>المبلغ</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>انخراط شهري</td>
                    <td>50 درهم</td>
                </tr>
                <tr>
                    <td>مساهمة إضافية</td>
                    <td>20 درهم</td>
                </tr>
            </tbody>
        </table>

        <div class="receipt-footer">
            <p>شكراً لتعاونكم</p>
            <p id="receiptDate"></p>
        </div>
    </div>

    <script>
        // إدراج التاريخ والوقت بشكل تلقائي في أسفل الوصل
        document.getElementById('receiptDate').innerText = new Date().toLocaleString('ar-MA');
    </script>
</body>
</html>
